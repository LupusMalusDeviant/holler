[package]
name = "holler"
version = "0.2.0"
edition = "2021"
authors = ["Lupus Malus Deviant"]
description = "Holler: LAN-Funk ohne Umwege. Rohes PCM per UDP, ein Fenster, eine Exe."

[dependencies]
cpal = "0.15"
eframe = "0.31"
rtrb = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
global-hotkey = "0.6"
tray-icon = "0.24"
nnnoiseless = { version = "0.5", default-features = false }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
