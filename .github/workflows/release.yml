# Baut Holler bei jedem Versions-Tag (v1.2.3): Windows mit Signatur und Installer,
# dazu Linux und macOS als Archive (unsigniert), und hängt alles an ein GitHub-Release.
# Tests laufen vor jedem Bau.
#
# Secrets (einmalig, lokal):
#   powershell -Command "gh secret set SIGN_PFX_BASE64 --body ([Convert]::ToBase64String([IO.File]::ReadAllBytes('dist\LupusMalusDeviant.pfx')))"
#   gh secret set SIGN_PFX_PASSWORD
#
# Neues Release: Version in Cargo.toml erhöhen, committen, dann
#   git tag v1.2.0 && git push origin v1.2.0
# Handstart ohne Tag (workflow_dispatch) baut nur Artefakte.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Version lesen und mit Tag vergleichen
        id: ver
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$ver" | Out-File -Append $env:GITHUB_OUTPUT
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($tag -ne $ver) { throw "Tag v$tag passt nicht zur Version $ver in Cargo.toml. Erst Cargo.toml anpassen, sonst dreht der Updater im Kreis." }
          }
          Write-Host "Version $ver"

      - name: Tests
        run: cargo test --release --workspace

      - name: Bauen
        run: cargo build --release --workspace

      - name: Signatur vorbereiten
        id: sign
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64 -or -not $env:SIGN_PFX_PASSWORD) {
            Write-Host "Signatur-Secrets fehlen, es wird unsigniert gebaut."
            "enabled=false" | Out-File -Append $env:GITHUB_OUTPUT
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                Sort-Object Name -Descending |
                ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
                Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $st) { throw "signtool.exe nicht gefunden" }
          # Wrapper, damit Inno Setup (/S) und wir dieselbe Signatur nutzen; Passwort bleibt in der Umgebung.
          @"
          @echo off
          "$st" sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\cert.pfx" /p %SIGN_PFX_PASSWORD% /d Holler %1
          if errorlevel 1 "$st" sign /fd SHA256 /f "$env:RUNNER_TEMP\cert.pfx" /p %SIGN_PFX_PASSWORD% /d Holler %1
          "@ | Out-File -Encoding ascii "$env:RUNNER_TEMP\sign-one.cmd"
          "enabled=true" | Out-File -Append $env:GITHUB_OUTPUT
          "wrapper=$env:RUNNER_TEMP\sign-one.cmd" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Exe signieren
        if: steps.sign.outputs.enabled == 'true'
        shell: cmd
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: call "${{ steps.sign.outputs.wrapper }}" target\release\holler.exe

      - name: Installer bauen
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup nicht gefunden" }
          $ver = "${{ steps.ver.outputs.version }}"
          $args = @("/DAppVersion=$ver", "/DExeDir=target\release")
          if ("${{ steps.sign.outputs.enabled }}" -eq "true") {
            $args += "/DSignSetup"
            # Keine Anfuehrungszeichen: PowerShell wuerde sie als \" weiterreichen und Inno faende die Datei nicht.
            $args += "/Sholler=cmd /c ${{ steps.sign.outputs.wrapper }} `$f"
          }
          $args += "installer\holler.iss"
          & $iscc @args
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen" }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx" -Force -ErrorAction SilentlyContinue

      - name: Paket schnüren
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\holler.exe out\
          Copy-Item "dist\Holler-Setup-$ver.exe" out\
          Copy-Item dist\LupusMalusDeviant.cer out\
          Copy-Item tools\vertrauen.cmd out\
          Compress-Archive -Path out\holler.exe, out\LupusMalusDeviant.cer, out\vertrauen.cmd -DestinationPath out\holler-$ver-portable.zip
          $signed = "${{ steps.sign.outputs.enabled }}" -eq "true"
          $notes = @()
          $notes += "**Windows, installieren (empfohlen)**: ``Holler-Setup-$ver.exe`` starten. Pro Benutzer, ohne Adminrechte, mit Startmenü-Eintrag, optional Autostart im Tray. Künftige Versionen meldet Holler selbst und installiert sie auf Klick."
          $notes += ""
          $notes += "**Windows, portabel**: ``holler.exe`` aus ``holler-$ver-portable.zip`` irgendwohin kopieren und starten."
          $notes += ""
          $notes += "**Linux / macOS**: ``holler-$ver-linux-x64.tar.gz`` bzw. ``holler-$ver-macos-arm64.tar.gz`` entpacken, ``holler`` starten. Ohne Tray und ohne Installer; unsigniert (macOS: Rechtsklick → Öffnen beim ersten Start). Enthält auch ``holler-hub`` für den eigenen Vermittler."
          $notes += ""
          $notes += "**Dateien**"
          $notes += "- ``Holler-Setup-$ver.exe``: Installer" + $(if ($signed) { ", signiert mit dem Zertifikat Lupus Malus Deviant" } else { " (**unsigniert**, Signatur-Secrets fehlen)" })
          $notes += "- ``holler.exe``: das Programm, Windows 10/11 x64" + $(if ($signed) { ", signiert" } else { "" })
          $notes += "- ``LupusMalusDeviant.cer`` + ``vertrauen.cmd``: Zertifikat als vertrauenswürdig eintragen (``vertrauen.cmd`` als Administrator, neben der .cer)"
          $notes += ""
          $notes += "SmartScreen meldet sich bei Downloads einmal: *Weitere Informationen* → *Trotzdem ausführen*. Beim ersten Start den Firewall-Dialog mit *Private Netzwerke* bestätigen."
          $notes -join "`n" | Out-File -Encoding utf8 notes.md
          Get-ChildItem out

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Holler ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: |
            out/Holler-Setup-${{ steps.ver.outputs.version }}.exe
            out/holler.exe
            out/holler-${{ steps.ver.outputs.version }}-portable.zip
            out/LupusMalusDeviant.cer
            out/vertrauen.cmd

      - name: Artefakt (Handstart ohne Tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: holler-${{ steps.ver.outputs.version }}-windows
          path: out/

  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libxdo-dev

      - name: Version lesen
        id: ver
        shell: bash
        run: |
          ver=$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Version $ver"

      - name: Tests
        run: cargo test --release --workspace

      - name: Bauen
        run: cargo build --release --workspace

      - name: Archiv
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.version }}"
          mkdir -p out/holler-$ver
          cp target/release/holler target/release/holler-hub README.md out/holler-$ver/
          tar -C out -czf "out/holler-$ver-${{ matrix.label }}.tar.gz" "holler-$ver"
          ls -la out

      - name: Ans Release hängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/holler-${{ steps.ver.outputs.version }}-${{ matrix.label }}.tar.gz

      - name: Artefakt (Handstart ohne Tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: holler-${{ steps.ver.outputs.version }}-${{ matrix.label }}
          path: out/*.tar.gz
