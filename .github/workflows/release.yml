# Baut Holler bei jedem Versions-Tag (v1.2.3) auf einem Windows-Läufer, signiert,
# wenn die Secrets SIGN_PFX_BASE64 und SIGN_PFX_PASSWORD gesetzt sind, und hängt
# Exe, Zertifikat und Vertrauensskript an ein GitHub-Release.
#
# Secrets setzen (einmalig, lokal):
#   gh secret set SIGN_PFX_BASE64 --body "$([Convert]::ToBase64String([IO.File]::ReadAllBytes('dist\LupusMalusDeviant.pfx')))"
#   gh secret set SIGN_PFX_PASSWORD
# Ohne Secrets wird unsigniert gebaut und das im Release vermerkt.
#
# Neues Release: git tag v0.2.0 && git push origin v0.2.0

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bauen
        run: cargo build --release

      - name: Signieren
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) {
            Write-Host "Keine Signatur-Secrets gesetzt, Exe bleibt unsigniert."
            "unsigned" | Out-File signed.txt
            exit 0
          }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                Sort-Object Name -Descending |
                ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
                Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $st) { throw "signtool.exe nicht gefunden" }
          & $st sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f cert.pfx /p $env:SIGN_PFX_PASSWORD /d Holler target\release\holler.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Zeitstempel fehlgeschlagen, signiere ohne Zeitstempel."
            & $st sign /fd SHA256 /f cert.pfx /p $env:SIGN_PFX_PASSWORD /d Holler target\release\holler.exe
            if ($LASTEXITCODE -ne 0) { throw "Signieren fehlgeschlagen" }
          }
          Remove-Item cert.pfx -Force
          "signed" | Out-File signed.txt
          & $st verify /pa /v target\release\holler.exe | Select-String "Issued to:" | Select-Object -First 1

      - name: Paket schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\holler.exe out\
          Copy-Item dist\LupusMalusDeviant.cer out\
          Copy-Item tools\vertrauen.cmd out\
          Compress-Archive -Path out\* -DestinationPath out\holler-windows-x64.zip
          $state = Get-Content signed.txt
          $notes = @()
          $notes += "**Dateien**"
          $notes += "- ``holler.exe``: das Programm (Windows 10/11, x64)" + $(if ($state -eq "signed") { ", signiert mit dem Zertifikat Lupus Malus Deviant" } else { ", **unsigniert** (Signatur-Secrets fehlen)" })
          $notes += "- ``LupusMalusDeviant.cer``: öffentlicher Teil des Zertifikats"
          $notes += "- ``vertrauen.cmd``: trägt das Zertifikat als vertrauenswürdig ein (als Administrator, neben der .cer)"
          $notes += "- ``holler-windows-x64.zip``: alle drei zusammen"
          $notes += ""
          $notes += "**Erster Start**: Exe auf beide Rechner, starten, Firewall-Dialog mit *Private Netzwerke* bestätigen. SmartScreen meldet sich bei Downloads einmal: *Weitere Informationen* → *Trotzdem ausführen*."
          $notes -join "`n" | Out-File -Encoding utf8 notes.md

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            out/holler.exe
            out/LupusMalusDeviant.cer
            out/vertrauen.cmd
            out/holler-windows-x64.zip

      - name: Artefakt (bei Handstart ohne Tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: holler-windows-x64
          path: out/
